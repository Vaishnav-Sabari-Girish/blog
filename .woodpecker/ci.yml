when:
  - event: [push, pull_request]
    branch: main
  - event: cron

steps:
  - name: build
    image: ubuntu:22.04
    commands:
      - apt-get update -qq
      - apt-get install -y -qq curl tar
      - |
        ZOLA_VERSION="0.22.1"   # pick the version you need
        curl -LsSf --fail "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zola.tar.gz
        tar xzf /tmp/zola.tar.gz -C /tmp
        install -m 755 /tmp/zola /usr/local/bin/zola
      - zola build
    when:
      - event: [push, pull_request, cron]

  - name: link-checker
    image: lycheeverse/lychee:latest
    depends_on: [build]
    commands:
      - lychee --max-concurrency 1 -v \
          --exclude "linkedin.com" \
          --exclude "nxp.com" \
          --exclude "vaishnav-sabari-girish.github.io" \
          public/**/*.html
    when:
      - event: [push, pull_request, cron]

  - name: spelling-checker
    image: debian:bookworm-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates
      - |
        TYPOS_VERSION="1.49.0"
        curl -LsSf --fail "https://github.com/crate-ci/typos/releases/download/v$${TYPOS_VERSION}/typos-v$${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/typos.tar.gz
        mkdir -p /tmp/typos-extract
        tar xzf /tmp/typos.tar.gz -C /tmp/typos-extract
        find /tmp/typos-extract -type f -name typos -exec cp {} /usr/local/bin/typos \;
        chmod +x /usr/local/bin/typos
      - typos content
    when:
      - event: [push, pull_request]
