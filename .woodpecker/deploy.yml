when:
  branch:
    exclude: pages

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  - name: build
    image: ubuntu:22.04
    commands:
      - apt-get update -qq
      - apt-get install -y -qq curl tar
      - |
        ZOLA_VERSION="0.22.1"
        curl -LsSf --fail "https://github.com/getzola/zola/releases/download/v$${ZOLA_VERSION}/zola-v$${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zola.tar.gz
        tar xzf /tmp/zola.tar.gz -C /tmp
        install -m 755 /tmp/zola /usr/local/bin/zola
      - zola build
    when:
      - event: [push, pull_request]

  - name: publish
    image: alpine/git
    environment:
      TOKEN:
        from_secret: cbtoken
      MAIL:
        from_secret: cbmail
    commands:
      - git config --global user.email "$MAIL"
      - git config --global user.name "Woodpecker CI"
      - git clone --branch pages https://$TOKEN@codeberg.org/$CI_REPO.git $CI_REPO_NAME || git clone https://$TOKEN@codeberg.org/$CI_REPO.git $CI_REPO_NAME
      - cd $CI_REPO_NAME
      - git checkout pages || git checkout -b pages
      - git rm -rf * || true
      - cp -ar ../public/. .
      - git add --all
      - git commit -m "Woodpecker CI ${CI_COMMIT_SHA} [SKIP CI]" --allow-empty
      - git push origin pages
    when:
      - event: push
        branch: main
