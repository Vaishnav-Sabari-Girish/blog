{% if left_src %}
<div {% if right_src %}class="responsive-image-grid"{% else %}class="single-media-center"{% endif %}>

  <figure style="margin: 0; display: flex; flex-direction: column; height: 100%;">
    {% if left_src is ending_with(pat=".mp4") %}
      <video style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" autoplay loop muted playsinline>
        <source src="{{ get_url(path=left_src) }}" type="video/mp4">
      </video>
    {% else %}
      <img src="{{ get_url(path=left_src) }}" alt="{% if left_alt %}{{ left_alt }}{% endif %}" class="zoomable" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: pointer;">
    {% endif %}
    {% if left_caption %}
      <figcaption style="text-align: center; font-size: 0.85em; opacity: 0.8; margin-top: 0.5rem;">{{ left_caption }}</figcaption>
    {% endif %}
  </figure>

  {% if right_src %}
  <figure style="margin: 0; display: flex; flex-direction: column; height: 100%;">
    {% if right_src is ending_with(pat=".mp4") %}
      <video style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" autoplay loop muted playsinline>
        <source src="{{ get_url(path=right_src) }}" type="video/mp4">
      </video>
    {% else %}
      <img src="{{ get_url(path=right_src) }}" alt="{% if right_alt %}{{ right_alt }}{% endif %}" class="zoomable" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: pointer;">
    {% endif %}
    {% if right_caption %}
      <figcaption style="text-align: center; font-size: 0.85em; opacity: 0.8; margin-top: 0.5rem;">{{ right_caption }}</figcaption>
    {% endif %}
  </figure>
  {% endif %}

</div>
{% endif %}
