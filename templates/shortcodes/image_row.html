{% set cap_left = left_caption | default(value="") %}
{% set cap_right = right_caption | default(value="") %}

<!-- Swapped inline styles for the responsive class -->
<div class="responsive-image-grid">
  
  <figure style="margin: 0; display: flex; flex-direction: column; height: 100%;">
    <img src="{{ get_url(path=left_src) }}" alt="{{ left_alt | default(value='') }}" class="zoomable" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: pointer; transition: opacity 0.2s;">
    {% if cap_left %}
      <figcaption style="text-align: center; font-size: 0.85em; opacity: 0.8; margin-top: 0.5rem;">{{ cap_left }}</figcaption>
    {% endif %}
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; height: 100%;">
    <img src="{{ get_url(path=right_src) }}" alt="{{ right_alt | default(value='') }}" class="zoomable" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: pointer; transition: opacity 0.2s;">
    {% if cap_right %}
      <figcaption style="text-align: center; font-size: 0.85em; opacity: 0.8; margin-top: 0.5rem;">{{ cap_right }}</figcaption>
    {% endif %}
  </figure>

</div>
